    <!-- User Menu -->
    <div class="user-menu-container">
      <button class="user-menu-btn" id="userMenuBtn" aria-expanded="false" aria-label="User menu">

  <div class="nav-overlay" id="navOverlay"></div>

  <script>
    // User Menu UI logic
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('userMenuBtn');
      const dropdown = document.getElementById('userDropdown');
      
      if (btn && dropdown) {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const expanded = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', !expanded);
          dropdown.classList.toggle('show', !expanded);
        });
        
        document.addEventListener('click', (e) => {
          if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
            btn.setAttribute('aria-expanded', 'false');
            dropdown.classList.remove('show');
          }
        });
      }

      // Mobile Menu Toggle
      const mobileBtn = document.getElementById('mobileMenuBtn');
      const navOverlay = document.getElementById('navOverlay');
      if (mobileBtn && navOverlay) {
        const toggleMenu = () => {
          const isOpen = document.body.classList.contains('nav-open');
          document.body.classList.toggle('nav-open', !isOpen);
          mobileBtn.setAttribute('aria-expanded', !isOpen);
        };
        mobileBtn.addEventListener('click', toggleMenu);
        navOverlay.addEventListener('click', toggleMenu);
      }

      // Scroll to Top Logic
      const scrollTopBtn = document.getElementById('scrollTopBtn');
      if (scrollTopBtn) {
        window.addEventListener('scroll', () => {
          if (window.scrollY > 100) {
            scrollTopBtn.classList.add('show');
          } else {
            scrollTopBtn.classList.remove('show');
          }
        });
        scrollTopBtn.addEventListener('click', () => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    });
  </script>

  <!-- ── Page Header ──────────────────────────────────────────────────── -->
  <header class="notes-index-header">
    <h1>Short Notes &amp; Formula Sheets</h1>
    <p>Unit and section wise notes for all 8 units of UPSC Physics Optional syllabus.</p>
  </header>

  <!-- ── Notes Grid (populated by notes-index.js) ─────────────────────── -->
  <main class="notes-grid" id="notesGrid" aria-label="Notes index">
    <!-- Unit cards rendered by JS -->
    <div class="prose-loading">
      <div class="prose-spinner"></div>
      <span>Loading notes index…</span>
    </div>
  </main>

  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <script src="./notes-index.js"></script>
</body>
</html>
