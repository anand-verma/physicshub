<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="UPSC Physics Optional — Note viewer with KaTeX equation rendering">
  <!-- Title is set dynamically by notes.js based on the note being viewed -->
  <title>Physics Notes | PhysicsHub</title>
  <link rel="icon" type="image/jpeg" href="../assets/favicon.jpg">
  <link rel="stylesheet" href="./notes.css">

  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

  <!-- Print note styles override the title via window.print() in notes.js -->
</head>
<body>

  <!-- ── Site Nav ──────────────────────────────────────────────────────── -->
  <nav class="site-nav" aria-label="Site navigation">
    <button class="menu-toggle" id="mobileMenuBtn" aria-label="Toggle menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M4 6h16M4 18h16" stroke-linecap="round"/></svg>
    </button>
    <a class="site-nav-brand" href="../index.html"><span class="brand-prefix">UPSC </span>Physics<span class="brand-suffix">Hub</span></a>
    
    <div class="nav-links" id="navLinks">
      <div class="nav-links-inner">
    
    <a class="nav-tab" href="../index.html" id="tabPyq">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 10h16M4 14h8M4 18h6"/></svg>
      PYQ Repository
    </a>
    
    <a class="nav-tab active" href="./index.html" id="tabNotes" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Notes
    </a>
    
    <a class="nav-tab disabled" href="#" title="Coming Soon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      QCAB
    </a>

    <!-- User Menu -->
    <div class="user-menu-container">
      <button class="user-menu-btn" id="userMenuBtn" aria-expanded="false" aria-label="User menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </button>
      <div class="user-dropdown" id="userDropdown">
        <a class="user-dropdown-item" href="../tracker/index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Tracking Dashboard
        </a>
        <a class="user-dropdown-item" href="../index.html#bookmarks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
          Bookmarks
        </a>
      </div>
    </div>
      </div>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>

  <script>
    // User Menu UI logic
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('userMenuBtn');
      const dropdown = document.getElementById('userDropdown');
      
      if (btn && dropdown) {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const expanded = btn.getAttribute('aria-expanded') === 'true';
          btn.setAttribute('aria-expanded', !expanded);
          dropdown.classList.toggle('show', !expanded);
        });
        
        document.addEventListener('click', (e) => {
          if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
            btn.setAttribute('aria-expanded', 'false');
            dropdown.classList.remove('show');
          }
        });
      }

      // Mobile Menu Toggle
      const mobileBtn = document.getElementById('mobileMenuBtn');
      const navOverlay = document.getElementById('navOverlay');
      if (mobileBtn && navOverlay) {
        const toggleMenu = () => {
          const isOpen = document.body.classList.contains('nav-open');
          document.body.classList.toggle('nav-open', !isOpen);
          mobileBtn.setAttribute('aria-expanded', !isOpen);
        };
        mobileBtn.addEventListener('click', toggleMenu);
        navOverlay.addEventListener('click', toggleMenu);
      }

      // Scroll to Top Logic
      const scrollTopBtn = document.getElementById('scrollTopBtn');
      if (scrollTopBtn) {
        window.addEventListener('scroll', () => {
          if (window.scrollY > 100) {
            scrollTopBtn.classList.add('show');
          } else {
            scrollTopBtn.classList.remove('show');
          }
        });
        scrollTopBtn.addEventListener('click', () => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    });
  </script>

  <!-- ── Viewer layout ────────────────────────────────────────────────── -->
  <div class="viewer-layout">

    <!-- ── Left: main prose column ──────────────────────────────────── -->
    <main class="viewer-main">

      <!-- Breadcrumb -->
      <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Notes</a>
        <span class="breadcrumb-sep">›</span>
        <span>Loading…</span>
      </nav>

      <!-- Prose card (markdown injected here) -->
      <article class="prose-card">
        <!-- Loading spinner shown until content arrives -->
        <div id="proseLoading" class="prose-loading">
          <div class="prose-spinner"></div>
          <span>Rendering note…</span>
        </div>

        <!-- Actual prose content (populated by notes.js) -->
        <div id="proseContent" class="prose" hidden></div>
      </article>

    </main>

    <!-- ── Right: sidebar ───────────────────────────────────────────── -->
    <aside class="viewer-sidebar" aria-label="Note tools">

      <!-- Print card -->
      <div class="sidebar-card">
        <div class="sidebar-head">Print</div>
        <div class="sidebar-body">
          <button id="printNoteBtn" class="print-note-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <polyline points="6 9 6 2 18 2 18 9"/>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
              <rect x="6" y="14" width="12" height="8"/>
            </svg>
            Print Friendly
          </button>
          <p style="font-size:10.5px;color:#6b7280;margin:8px 0 0;line-height:1.5;">
            Equations render correctly in print. Right margin ruled line included.
          </p>
        </div>
      </div>

      <!-- Prev / Next navigation card -->
      <div class="sidebar-card">
        <div class="sidebar-head">Navigation</div>
        <div class="nav-prev-next">
          <!-- Previous -->
          <a id="prevNoteBtn" class="nav-note-btn" href="#" aria-label="Previous note">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
            <span>
              <span class="nav-note-label">Previous</span>
              <span id="prevNoteLabel">—</span>
            </span>
          </a>
          <!-- Next -->
          <a id="nextNoteBtn" class="nav-note-btn" href="#" aria-label="Next note">
            <span>
              <span class="nav-note-label">Next</span>
              <span id="nextNoteLabel">—</span>
            </span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </a>
          <!-- Back to index -->
          <a class="nav-note-btn" href="index.html" aria-label="Back to notes index">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>
              <span class="nav-note-label">Index</span>
              <span>All Notes</span>
            </span>
          </a>
        </div>
      </div>

    </aside>
  </div><!-- end .viewer-layout -->

  <!-- ── Scripts ──────────────────────────────────────────────────────── -->

  <!-- marked.js: fast, zero-dep markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

  <!-- KaTeX core + auto-render -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Show prose container after scripts are ready; hide spinner -->
  <script>
    // notes.js calls window.__showProse() after markdown + KaTeX are done
    window.__showProse = function () {
      const loading = document.getElementById("proseLoading");
      const content = document.getElementById("proseContent");
      if (loading) loading.hidden = true;
      if (content) content.hidden = false;
    };
  </script>

  <!-- Application logic -->
  <script src="./notes.js"></script>

  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg>
  </button>
</body>
</html>
