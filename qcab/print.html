<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PYQ Test Print Preview | UPSC PhysicsHub</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/jpeg" href="../assets/favicon.jpg">
  <link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="./qcab.css">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(','\\)'], ['$', '$']], displayMath: [['\\[','\\]'], ['$$','$$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body class="qcab-print-preview-body">
  <header class="qcab-preview-toolbar">
    <div>
      <strong>PYQ Test Print Preview</strong>
      <span id="printStatus">Preparing pages…</span>
    </div>
    <div class="qcab-preview-actions">
      <button id="backToTest" class="clear-btn" type="button">← Back to Test</button>
      <button id="printBtn" class="print-btn" type="button" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        <span>Print</span>
      </button>
    </div>
  </header>

  <main id="qcabPrintRoot" class="qcab-print-root" aria-label="PYQ Test print preview"></main>

  <script type="module" src="./qcab-print.js"></script>
</body>
</html>
