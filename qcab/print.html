<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PYQ Test Print Preview | UPSC PhysicsHub</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/jpeg" href="../assets/favicon.jpg">
  <link rel="stylesheet" href="../assets/site.css">
  <link rel="stylesheet" href="./qcab.css">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(','\\)'], ['$', '$']], displayMath: [['\\[','\\]'], ['$$','$$']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body class="qcab-print-preview-body">
  <header class="qcab-preview-toolbar">
    <div>
      <strong>PYQ Test Print Preview</strong>
      <span id="printStatus">Preparing pages…</span>
    </div>
    <div class="qcab-preview-actions">
      <button id="backToTest" class="clear-btn" type="button">← Back to Test</button>
      <span class="qcab-print-shortcut" aria-label="Print shortcut">Press <kbd>Ctrl</kbd> + <kbd>P</kbd> to print</span>
    </div>
  </header>

  <main id="qcabPrintRoot" class="qcab-print-root" aria-label="PYQ Test print preview"></main>

  <script type="module" src="./qcab-print.js"></script>
</body>
</html>
